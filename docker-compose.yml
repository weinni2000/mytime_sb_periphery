# Side services for the schwarzes-brett Odoo (mytime_sb), run separately
# from the Doodba stack:
#   docker compose up -d valhalla
#   docker compose up -d registry registry-ui
#
# This file runs on the server and in development. The Valhalla build
# services live in docker-compose.override.yml, which only exists in
# development (compose loads it automatically there).
#
# Odoo (in Docker) reaches them via host.docker.internal, like n7m.
name: mytime_sb_periphery

services:
  # Routing engine for travel-time search areas (bulletin_board_isochrone).
  # Slim: the plain Valhalla image only serves the prebuilt tiles in
  # ./valhalla/custom_files (valhalla.json, valhalla_tiles.tar, admins and
  # timezones sqlite). It never downloads or builds anything; the tiles are
  # built in development (valhalla/rebuild.sh) and synced to the server
  # (sync/sync_to_server.sh).
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    restart: unless-stopped
    command: ["valhalla_service", "/custom_files/valhalla.json", "2"]
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

  # Private container registry for our own images (Docker Hub replacement).
  # Users live in ./registry/auth/htpasswd, created by registry/add-user.sh.
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./registry/data:/var/lib/registry
      - ./registry/auth:/auth:ro
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd

  # Web UI for the registry. It proxies to the registry itself, so the
  # registry needs no CORS headers.
  registry-ui:
    image: joxit/docker-registry-ui:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:80"
    environment:
      REGISTRY_TITLE: mytime registry
      NGINX_PROXY_PASS_URL: http://registry:5000
      SINGLE_REGISTRY: "true"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    depends_on:
      - registry
